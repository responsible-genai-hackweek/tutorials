<section data-slide="18-git-workflows"
         aria-label="Slide 18: Git Workflows"
         class="slide">

  <div class="accent-bar"></div>

  <div class="header">
    <p class="eyebrow">Git Workflows</p>
    <h1>Git workflows: essential when working with coding agents.</h1>
  </div>

  <div class="diagram-row">
    <svg class="diagram" viewBox="0 0 950 315" fill="none"
         aria-label="Vertical flow diagram: commit baseline, agent runs, review, commit with attestation — repeat">

      <!-- ── CONNECTOR LINE ─────────────────────────────────────── -->
      <line x1="20" y1="43" x2="20" y2="251"
            stroke="rgba(75,46,131,0.20)" stroke-width="1.5" stroke-dasharray="5 3"/>

      <!-- ── ARROWS ─────────────────────────────────────────────── -->
      <polygon points="20,79 14,67 26,67" fill="rgba(75,46,131,0.30)"/>
      <polygon points="20,149 14,137 26,137" fill="rgba(75,46,131,0.30)"/>
      <polygon points="20,219 14,207 26,207" fill="rgba(75,46,131,0.30)"/>

      <!-- ── ROW 1: YOU — commit baseline ──────────────────────── -->
      <rect x="35" y="24" width="150" height="38" rx="19"
            fill="rgba(75,46,131,0.10)" stroke="#4b2e83" stroke-width="1.5"/>
      <text x="110" y="48" text-anchor="middle"
            font-family="'Encode Sans',sans-serif" font-size="17" font-weight="700"
            fill="#4b2e83">YOU</text>
      <text x="205" y="38" font-family="'Encode Sans',sans-serif" font-size="19" font-weight="700"
            fill="#4b2e83">Commit: establish a clean baseline</text>
      <text x="205" y="60" font-family="'Open Sans',sans-serif" font-size="15"
            fill="rgba(0,0,0,0.45)">before the agent starts, so you have a safe rollback point</text>

      <!-- ── ROW 2: AGENT — runs ────────────────────────────────── -->
      <rect x="35" y="94" width="150" height="38" rx="19"
            fill="#4b2e83"/>
      <text x="110" y="118" text-anchor="middle"
            font-family="'Encode Sans',sans-serif" font-size="17" font-weight="700"
            fill="white">AGENT</text>
      <text x="205" y="108" font-family="'Encode Sans',sans-serif" font-size="19" font-weight="700"
            fill="#4b2e83">Agent runs</text>
      <text x="205" y="130" font-family="'Open Sans',sans-serif" font-size="15"
            fill="rgba(0,0,0,0.45)">large changes, fast, confident — and potentially wrong</text>

      <!-- ── ROW 3: YOU — review ────────────────────────────────── -->
      <rect x="35" y="164" width="150" height="38" rx="19"
            fill="rgba(75,46,131,0.10)" stroke="#4b2e83" stroke-width="1.5"/>
      <text x="110" y="188" text-anchor="middle"
            font-family="'Encode Sans',sans-serif" font-size="17" font-weight="700"
            fill="#4b2e83">YOU</text>
      <text x="205" y="178" font-family="'Encode Sans',sans-serif" font-size="19" font-weight="700"
            fill="#4b2e83">Review every change</text>
      <text x="205" y="200" font-family="'Open Sans',sans-serif" font-size="15"
            fill="rgba(0,0,0,0.45)">read the diff — do not accept output you have not checked</text>

      <!-- ── ROW 4: YOU — commit with attestation ───────────────── -->
      <rect x="35" y="232" width="150" height="38" rx="19"
            fill="rgba(75,46,131,0.10)" stroke="#4b2e83" stroke-width="1.5"/>
      <text x="110" y="256" text-anchor="middle"
            font-family="'Encode Sans',sans-serif" font-size="17" font-weight="700"
            fill="#4b2e83">YOU</text>
      <text x="205" y="246" font-family="'Encode Sans',sans-serif" font-size="19" font-weight="700"
            fill="#4b2e83">Commit: your message is the attestation</text>
      <!-- Commit message example -->
      <rect x="205" y="253" width="735" height="28" rx="3"
            fill="rgba(75,46,131,0.06)" stroke="rgba(75,46,131,0.18)" stroke-width="1"/>
      <text x="216" y="272" font-family="'Courier New',monospace" font-size="14"
            fill="#4b2e83">refactor snow depth aggregation to use xarray DataArray</text>

      <!-- ── REPEAT NOTE ─────────────────────────────────────────── -->
      <text x="475" y="305" text-anchor="middle"
            font-family="'Open Sans',sans-serif" font-size="17" font-style="italic"
            fill="#b7a57a">↻ repeat for each agent task</text>

    </svg>
  </div>

  <style>
    section[data-slide="18-git-workflows"] {
      background: var(--uw-white);
      padding: var(--space-7) var(--space-10) var(--space-6) var(--space-12);
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
      overflow: hidden;
      gap: var(--space-5);
    }

    section[data-slide="18-git-workflows"] .accent-bar {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 8px;
      background: var(--uw-spirit-gold);
    }

    section[data-slide="18-git-workflows"] .header {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    section[data-slide="18-git-workflows"] .eyebrow {
      font-family: var(--font-body);
      font-size: clamp(1.125rem, 1.1vw, 1.125rem);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--uw-gray-70);
      margin: 0;
    }

    section[data-slide="18-git-workflows"] h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 3vw, 3rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--uw-spirit-purple);
      margin: 0;
    }

    section[data-slide="18-git-workflows"] .diagram-row {
      flex: 1;
      display: flex;
      align-items: center;
    }

    section[data-slide="18-git-workflows"] .diagram {
      width: 100%;
    }
  </style>
</section>
