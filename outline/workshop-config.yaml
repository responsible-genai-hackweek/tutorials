event:
  days: 1
  hours_per_day: 6        # ≤ 4 hrs/day: lunch break is skipped automatically
  audience: intermediate
  Workshop type: genAI
  capstone: false
  topic_inventory: topic-inventory.md
  breaks:
    morning: 30           # default
    lunch: 60             # will be set to 0 automatically (hours_per_day ≤ 4)
    afternoon: 30         # default
  # Time budget (computed at invocation):
  #   daily breaks = 30 + 0 (half-day) + 30 = 60 min
  #   usable per day = (4 × 60) − 60 = 180 min
  #   total usable = 180 × 4 = 720 min (12 hours)

  purpose:
    # summary: what participants will be able to do by the end of this event.
    # Used as the backward design goal in step 6. Leave blank to use generic reasoning.
    summary: "
        "

    # series_context: how this event relates to others in a series.
    # Noted in plan.md for facilitator context; informs which topics to defer.
    series_context: "Part 2 will cover customizing LLMs (fine-tuning, RAG, local models)
        to address limitations participants encounter after Part 1. The idea
        is that people will finish with Part 1 realizing the need to custom 
        tailor gen-AI tools to their specific domain and needs. Topics that
        belong to Part 2 should be cut here or demoted to mention-only."

    # out_of_scope: topics or capabilities that belong to a different event.
    # Topics matching this description are cut with reason 'scope-part-2'
    # rather than 'time-budget', keeping the cut list self-documenting.
    out_of_scope: "Building or customizing AI systems, running local models, 
        RAG pipelines, sub-agents, and advanced agent development."

